      document.getElementById('destName').textContent = '—';
      document.getElementById('steps').innerHTML = '';
    }
    if (!silent && !PLAN) toast('已切换到 ' + FLOOR_LABEL[id]);
  }
  window.__switchFloor = switchFloor;

  /* ---- 启动：先把 3 层装上（和以前完全一样），再补网格/起始点 ---- */
  setVoid();
  useGridOf(CUR_FLOOR);
  setStart();
  buildFloor();
  buildFloors();
  buildList();
  updateCamera();          // 先把相机摆到等轴测角度，并按模型算好取景范围
  resize();
  // 预览面板 / iframe 里，容器一开始可能还算不出尺寸，隔一帧和稍后再补两次
  requestAnimationFrame(function () { resize(); });
  setTimeout(function () { resize(); }, 150);

  updateFoot();

  /* ?floor=B2-2 / B2-5：直接进某一层（截图和分享用） */
  (function applyQueryFloor() {
    var m = window.__QUERY__ || {};
    if (m.floor && FLOORS[m.floor]) switchFloor(m.floor);
  })();

  (function applyQueryFocus() {
    var m = window.__QUERY__ || {};
    if (m.focus) {
      var ok = false;
      for (var i = 0; i < D.rooms.length; i++)
        if (D.rooms[i].id === m.focus) { focusOn(D.rooms[i], m.margin ? parseFloat(m.margin) : 3.0); ok = true; break; }
      if (!ok && D.corridors)
        for (var j = 0; j < D.corridors.length; j++)
          if (D.corridors[j].id === m.focus) { focusOn(D.corridors[j], m.margin ? parseFloat(m.margin) : 3.0); ok = true; break; }
      if (ok) camera.zoom = cam.zoom, camera.updateProjectionMatrix();
    }
    if (m.noauto) return;
    setTimeout(function () {
      for (var k = 0; k < D.rooms.length; k++)
        if (D.rooms[k].id === '318') { navigateTo(D.rooms[k]); break; }
    }, 80);
  })();

  /* ?selftest=1：从大厅起点把每个房间都试走一遍，结果写进 #selftest。
     用于无头浏览器 --dump-dom 抓取，靠它验证"改完门和走廊，路网还通不通"。

     ★ 2026-11-11 重写：以前第二轮是假的（只抄宿主的 ok），根本没验"能不能直接进去"。
       现在套间要同时满足三条才算通：
         ① 宿主的门确实走得到；
         ② 自己的门确实开在"与宿主共用的那道墙"上、并且落在宿主的跨度内；
         ③ 自己那道门不许直接连通公共走廊（否则就是绕墙穿进去）。 */
  (function selfTest() {
    if (!(window.__QUERY__ || {}).selftest) return;
    setTimeout(function () {
      var from = nearestFree(START_PX.x, START_PX.y, 60);
      var res = {}, bad = [];

      // 第一轮：门直接开向公共走廊的房间
      for (var i = 0; i < D.rooms.length; i++) {
        var r = D.rooms[i];
        if (r.via) continue;
        var cands = doorCandidates(r), ok = false, dp = '';
        for (var c = 0; c < cands.length && !ok; c++) {
          var t = nearestFree(cands[c].x, cands[c].y, 6);
          if (!t) continue;
          if (astar(from, t)) { ok = true; dp = cands[c].k; }
        }
        res[r.id] = { ok: ok, k: dp, r: r };
        if (!ok) bad.push(r.id);
      }

      // 第二轮：套间（门开在宿主房间内部，只能经由宿主进入，例如 334/335 走 333）
      for (var j = 0; j < D.rooms.length; j++) {
        var r2 = D.rooms[j];
        if (!r2.via) continue;
        var host = findRoom(r2.via), hv = res[r2.via], why = [];

        if (!hv || !hv.ok) why.push('宿主不可达');

        if (host) {
          var k = r2.door, cx2 = (r2.x1 + r2.x2) / 2;
          var dx = (r2.doorT === undefined || r2.doorT === null) ? 0.5 : r2.doorT;
          if (k === 'N' || k === 'S') cx2 = r2.x1 + (r2.x2 - r2.x1) * dx;
          var sharesWall = (k === 'S' && Math.abs(r2.y2 - host.y1) <= 4) ||
                           (k === 'N' && Math.abs(r2.y1 - host.y2) <= 4);
          if (!sharesWall) why.push('门没开在与宿主共用的那道墙上');
          else if (k === 'S' && (cx2 < host.x1 - 2 || cx2 > host.x2 + 2)) why.push('门洞落在宿主跨度外');
          else if (k === 'N' && (cx2 < host.x1 - 2 || cx2 > host.x2 + 2)) why.push('门洞落在宿主跨度外');
        }

        // ③ 不许有"自己能直接通到公共走廊"的门
        var os2 = openingsOf(r2);
        for (var q = 0; q < os2.length; q++) {
          var p2 = facePoint(r2, os2[q].k, os2[q].t);
          var g2 = pxToGrid(p2.x, p2.y);
          if (isFree(g2[0], g2[1]) && astar(from, g2)) {
            why.push(os2[q].k + ' 面能直接走进去（穿墙）');
          }
        }

        res[r2.id] = { ok: !why.length, k: r2.door, via: r2.via, why: why.join('/'), r: r2 };
        if (why.length) bad.push(r2.id);
      }

      var out = [];
      for (var k2 = 0; k2 < D.rooms.length; k2++) {
        var rid = D.rooms[k2].id, v = res[rid] || { ok: false, k: '' };
        out.push(rid + ':' + (v.ok ? 'OK/' + v.k + (v.via ? '(via ' + v.via + ')' : '') : 'FAIL'));
      }
      var d = document.createElement('div');
      d.id = 'selftest';
      d.textContent = out.join(' ');
      d.setAttribute('data-bad', bad.join(','));
      document.body.appendChild(d);
    }, 150);
  })();

  /* ?probe=<房间ID>：把该房间的寻路结果写成 JSON 放进 #probe，供无头浏览器抓取。
     用它验证"334/335 只能经 333"这种关系：route 的倒数第二个点应该落在 333 的门口。 */
  (function probe() {
    var q = window.__QUERY__ || {};
    if (!q.probe) return;
    setTimeout(function () {
      var room = findRoom(q.probe);
      if (!room) return;
      var from = nearestFree(START_PX.x, START_PX.y, 60);
      var direct = {};
      var os = openingsOf(room);
      for (var i = 0; i < os.length; i++) {
        var p = facePoint(room, os[i].k, os[i].t);
        var g = pxToGrid(p.x, p.y);
        direct[os[i].k] = {
          pt: [Math.round(p.x), Math.round(p.y)],
          free: isFree(g[0], g[1]),
          reach: (isFree(g[0], g[1]) && from) ? !!astar(from, g) : false
        };
      }
      navigateTo(room);
      var out = { id: room.id, door: room.door, via: room.via || null, direct: direct,
                  route: LAST_PTS };
      var d = document.createElement('div');
      d.id = 'probe';
      d.textContent = JSON.stringify(out);
      document.body.appendChild(d);
    }, 400);
  })();

  var _cw = 0, _ch = 0;
  (function loop() {
    requestAnimationFrame(loop);
    // 每帧盯一次画布尺寸。容器变宽变窄不一定触发 window.resize（拖侧栏、切预览面板都会漏）
    if (stage.clientWidth !== _cw || stage.clientHeight !== _ch) {
      _cw = stage.clientWidth; _ch = stage.clientHeight;
      resize();
    }
    renderer.render(scene, camera);
  })();

  window.__NAV__ = {
    scene:scene, camera:camera,
    /* ★ data 是"当前层"的数据（换层后会变），别当成固定 3 层快照用。
       以前写成 data:D 是在闭包里取了当时那个对象，换层后还是旧的那份 —— 自检会误判。 */
    get data() { return D; },
    navigate:function (id, fid) {
      fid = fid || CUR_FLOOR;
      var r = findRoomIn(fid, id);
      if (r) { navigateTo(r, fid); return true; }
      /* 没给楼层：先在本层找，找不到再扫其它层 */
      for (var i = 0; i < D.rooms.length; i++) if (D.rooms[i].id === id) { navigateTo(D.rooms[i], CUR_FLOOR); return true; }
      for (var k in FLOORS) {
        if (!FLOORS.hasOwnProperty(k) || k === CUR_FLOOR) continue;
        var r2 = findRoomIn(k, id);
        if (r2) { navigateTo(r2, k); return true; }
      }
      return false;
    },
    setCam:function (azim, polar, zoom) {
      cam.azim = azim; cam.polar = polar;
      if (zoom) cam.zoom = zoom;
      updateCamera();
    },
    doorPoint: doorPoint,
    doorCandidates: doorCandidates,
    focus: function (id, mg) {
      if (id === null) { resetFocus(); return; }
      for (var i = 0; i < D.rooms.length; i++) if (D.rooms[i].id === id) { focusOn(D.rooms[i], mg); return; }
      if (D.spurs) for (var j = 0; j < D.spurs.length; j++) if (D.spurs[j].id === id) { focusOn(D.spurs[j], mg); return; }
    },
    lastRoute: function () { return LAST_PTS; },
    isFreePx: function (x, y) { var g = pxToGrid(x,y); return isFree(g[0], g[1]); },

    /* ---- 跨楼层相关（自检/验收用） ---- */
    floor: function () { return CUR_FLOOR; },
    floors: function () { return FLOOR_ORDER.slice(); },
    plan: function (fid, id) {
      var room = findRoomIn(fid, id);
      if (!room) return null;
      return planCrossFloor(fid, room);
    },
    planNow: function () { return PLAN; },
    /* 只算、不切层、不画：返回 {meters, floors, legs:楼层序列} 供无头验收断言 */
    planSummary: function (destFid, roomId) {
      var room = findRoomIn(destFid, roomId);
      if (!room) return null;
      var p = planCrossFloor(destFid, room);
      if (!p) return null;
      var hops = [];
      for (var i = 0; i < p.legs.length; i++) {
        var L = p.legs[i];
        if (L.kind === 'stair') hops.push({ stair: L.stair ? L.stair.id : '',
                                            from: L.fid, to: L.toFid, up: L.up, meters: L.meters });
      }
      return { start: p.startFid, dest: p.destFid, meters: p.meters,
               floors: p.floors, hops: hops, legs: p.legs.length };
    },
    switchFloor: switchFloor
  };

})();
</script>
</body>
</html>
