<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>定位二维码 · 打印页</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #eef1f4; }
  .card {
    width: 210mm; min-height: 297mm; padding: 26mm 20mm; background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; page-break-after: always;
  }
  .qr { width: 90mm; height: 90mm; padding: 4mm; }
  .qr img { width: 100%; height: 100%; display: block; }
  .place { margin-top: 12mm; font-size: 28pt; font-weight: 700; color: #0f172a; letter-spacing: 1px; }
  .pid { margin-top: 3mm; font-size: 13pt; color: #64748b; letter-spacing: 2px; font-family: ui-monospace, Menlo, monospace; }
  .tip { margin-top: 6mm; font-size: 13pt; color: #475569; }
  .url { margin-top: 5mm; font-size: 8.5pt; color: #a8b0bb; word-break: break-all; }
  @media print {
    body { background: #fff; }
    .card { width: auto; margin: 0; padding: 22mm; }
  }
</style></head>
<body>
<section class="card"><div class="qr"><img src="P-B2-01.svg" alt="P-B2-01"></div><div class="place">3层 · 东北楼梯口（324旁·疏散图旁）</div><div class="pid">P-B2-01</div><div class="tip">打开微信扫一扫 · 扫不出就在页面里手动选这个位置</div><div class="url">https://go.example.edu.cn/p-b2-01</div></section><section class="card"><div class="qr"><img src="P-B2-06.svg" alt="P-B2-06"></div><div class="place">5层 · 西北楼梯口（疏散图红点旁）</div><div class="pid">P-B2-06</div><div class="tip">打开微信扫一扫 · 扫不出就在页面里手动选这个位置</div><div class="url">https://go.example.edu.cn/p-b2-06</div></section><section class="card"><div class="qr"><img src="P-B2-08.svg" alt="P-B2-08"></div><div class="place">2层 · 西北楼梯口</div><div class="pid">P-B2-08</div><div class="tip">打开微信扫一扫 · 扫不出就在页面里手动选这个位置</div><div class="url">https://go.example.edu.cn/p-b2-08</div></section>
</body></html>
