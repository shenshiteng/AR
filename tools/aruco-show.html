<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>定位码 · 全屏显示</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0b1220; color: #e2e8f0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px;
  }
  .mk {
    width: min(78vmin, 480px); aspect-ratio: 1/1;
    background: #fff; border-radius: 10px; padding: 4%;
  }
  .mk svg { width: 100%; height: 100%; display: block; }
  .place { font-size: 18px; font-weight: 700; }
  .sub { font-size: 12px; color: #94a3b8; margin-top: -8px; }
  .bar { display: flex; gap: 10px; align-items: center; }
  button, select {
    font-family: inherit; font-size: 14px; padding: 9px 14px; border-radius: 10px;
    border: 1px solid rgba(148,163,184,.35); background: rgba(255,255,255,.07); color: #e2e8f0;
  }
  button { cursor: pointer; }
  select option { color: #0f172a; }
  .hint { font-size: 11.5px; color: #64748b; text-align: center; line-height: 1.7; }
</style>
</head>
<body>

<div class="mk" id="mk"></div>
<div class="place" id="place">—</div>
<div class="sub" id="sub">—</div>

<div class="bar">
  <button id="prev" type="button">← 上一个</button>
  <select id="sel"></select>
  <button id="next" type="button">下一个 →</button>
</div>

<div class="hint">
  手机先打开这一页，把屏幕对着电脑摄像头，<br>
  电脑上打开 <b>ar.html</b> 就能扫到它 —— 不用打印、不用 https。
</div>

<script src="../js/vendor/js-aruco2-cv.js"></script>
<script src="../js/vendor/js-aruco2.js"></script>
<script src="../data/labs.js"></script>
<script src="../js/aruco-marker.js"></script>
<script>
(function () {
  var D = window.LAB_DATA;
  var locs = (D.locations || []).slice().sort(function (a, b) {
    return (a.marker || 0) - (b.marker || 0);
  });
  var idx = 0;
  var sel = document.getElementById('sel');

  locs.forEach(function (l, i) {
    var o = document.createElement('option');
    o.value = String(i);
    o.textContent = (l.marker !== undefined ? l.marker : i) + ' · ' + l.place;
    sel.appendChild(o);
  });

  var want = new URLSearchParams(location.search).get('m');
  if (want !== null) {
    locs.forEach(function (l, i) {
      if (String(l.marker) === String(want) || l.id === want) idx = i;
    });
  }

  function render() {
    var l = locs[idx];
    if (!l) return;
    var mid = (l.marker === undefined) ? idx : l.marker;
    document.getElementById('mk').innerHTML = window.ArucoMark.svg(mid);
    document.getElementById('place').textContent = l.place;
    document.getElementById('sub').textContent = 'ArUco ID ' + mid + ' · ' + l.id;
    sel.value = String(idx);
  }

  document.getElementById('prev').onclick = function () { idx = (idx - 1 + locs.length) % locs.length; render(); };
  document.getElementById('next').onclick = function () { idx = (idx + 1) % locs.length; render(); };
  sel.onchange = function () { idx = parseInt(sel.value, 10) || 0; render(); };

  render();
})();
</script>
</body>
</html>
