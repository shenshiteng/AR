<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>平面图 → 数字地图（一键导入）</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#f5f7fa; --card:#fff; --line:#e2e8f0; --ink:#0f172a; --ink2:#475569;
    --muted:#94a3b8; --accent:#0d9488; --accent2:#0ea5e9; --warn:#b45309;
  }
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0;font-weight:700}
  header .sub{font-size:12px;color:var(--muted)}
  main{display:flex;height:calc(100% - 49px)}
  .stage-side{flex:1;min-width:0;padding:12px;display:flex}
  #stage{flex:1;position:relative;background:#eef2f7;border:1px solid var(--line);border-radius:12px;overflow:auto;display:grid;place-items:center;padding:10px}
  /* 图片定尺寸，SVG 绝对铺满它 —— 两层尺寸天然一致，叠加不会错位 */
  #wrap{position:relative;overflow:hidden;max-width:100%;max-height:100%;display:none}
  #wrap.on{display:block}
  #pic{display:block;width:100%;height:100%}
  #ov{position:absolute;inset:0;width:100%;height:100%;display:block}
  #tip{position:absolute;color:var(--muted);font-size:13px;text-align:center;line-height:1.9;padding:20px}
  aside{width:400px;flex:0 0 400px;border-left:1px solid var(--line);background:var(--card);overflow-y:auto;padding:14px 16px 40px}
  h2{font-size:12px;color:var(--ink2);margin:18px 0 8px;letter-spacing:.5px}
  h2:first-child{margin-top:0}
  label{display:block;font-size:12px;color:var(--ink2);margin:8px 0 4px}
  input[type=text],input[type=number],input[type=file],textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;color:var(--ink);background:#f8fafc}
  textarea{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;line-height:1.5;resize:vertical}
  .row{display:flex;gap:8px}
  .row>div{flex:1;min-width:0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-family:inherit;font-size:13px;cursor:pointer}
  .btn:hover{background:#f1f5f9}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.block{width:100%}
  .slide-row{display:flex;align-items:center;gap:8px}
  .slide-row input[type=range]{flex:1}
  .val{font-size:12px;color:var(--ink2);min-width:34px;text-align:right}
  .bar{margin-top:10px;padding:9px 12px;border-radius:9px;background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;font-size:12.5px;line-height:1.6}
  .bar.warn{background:#fffbeb;border-color:#fde68a;color:var(--warn)}
  .warns{margin:8px 0 0;padding:10px 12px 10px 26px;border-radius:9px;background:#fffbeb;border:1px solid #fde68a;color:var(--warn);font-size:12px;line-height:1.75}
  .warns li{margin:2px 0}
  .muted{color:var(--muted);font-size:11.5px;line-height:1.7}
  .seg{display:flex;gap:6px;margin-bottom:8px}
  .seg button{flex:1;padding:7px;border:1px solid var(--line);background:#f8fafc;border-radius:8px;font-size:12px;font-family:inherit;cursor:pointer;color:var(--ink2)}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  @media (max-width:900px){
    main{flex-direction:column;height:auto}
    .stage-side{height:46vh;flex:none}
    aside{width:auto;flex:none;border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>

<header>
  <h1>平面图 → 数字地图</h1>
  <span class="sub">选一张平面图，自动认出房间和走廊，直接生成可导航数据</span>
</header>

<main>
  <div class="stage-side">
    <div id="stage">
      <div id="tip">
        先点右边「选择平面图图片」<br>
        识别结果会画在图上：<b>青色框</b>=房间，<b>圆点</b>=走廊路点，<b>细线</b>=可通行
      </div>
      <div id="wrap">
        <img id="pic" alt="">
        <svg id="ov" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg>
      </div>
    </div>
  </div>

  <aside>
    <h2>1 · 选图</h2>
    <input type="file" id="file" accept="image/*">
    <div class="muted" id="dim" style="margin-top:6px">还没选图片</div>

    <h2>2 · 调参并识别</h2>
    <label>墙线灵敏度（越大越容易判成墙）</label>
    <div class="slide-row"><input type="range" id="thr" min="80" max="200" value="140"><span class="val" id="thrVal">140</span></div>
    <label>房间封口大小（房间连成一片就调大）</label>
    <div class="slide-row"><input type="range" id="seal" min="6" max="90" value="24"><span class="val" id="sealVal">24</span></div>
    <button class="btn primary block" id="run" style="margin-top:10px">重新识别</button>
    <div class="bar hidden" id="bar"></div>

    <h2>3 · 这一层是什么</h2>
    <div class="row">
      <div><label>楼栋 ID</label><input type="text" id="fBuilding" value="B2"></div>
      <div><label>楼层 ID</label><input type="text" id="fId" value="B2-4"></div>
    </div>
    <label>楼层名</label><input type="text" id="fName" value="4层">
    <label>平面图路径（图片要放进 assets/floors/）</label>
    <input type="text" id="fImage" value="assets/floors/B2-4F.jpg">
    <label>比例尺：1 像素 = 多少米</label>
    <input type="number" id="fScale" value="0.045" step="0.001" min="0.001">
    <div class="muted">用来把像素距离换算成米。图上量一段已知长度（比如走廊 20 米）÷ 它占的像素数，就是比例尺。</div>

    <h2>4 · 房间门牌号（可空）</h2>
    <label>按顺序填，逗号分隔</label>
    <input type="text" id="roomNumbers" placeholder="401,402,403,405……">
    <div class="muted">留空就用 R1、R2… 占位，以后在 labs.js 里改。填了会按「从上到下、从左到右」的顺序对应。识别不出的房间号，机器是读不出来的，只能你给。</div>

    <h2>5 · 生成</h2>
    <button class="btn primary block" id="gen">生成可导航数据</button>
    <div id="out"></div>
  </aside>
</main>

<script src="../js/floor-detect.js"></script>
<script src="../js/floor-import.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var state = { img: null, W: 0, H: 0, res: null };

  /* ---------- 选图 ---------- */
  $('file').onchange = function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var im = new Image();
      im.onload = function () {
        state.img = im;
        state.W = im.naturalWidth;
        state.H = im.naturalHeight;
        $('dim').textContent = state.W + ' × ' + state.H + ' px';
        $('tip').style.display = 'none';
        draw();
        runDetect();          // 选完图直接识别，不用再点一次
      };
      im.src = reader.result;
    };
    reader.readAsDataURL(f);
  };

  $('thr').oninput = function () { $('thrVal').textContent = this.value; };
  $('seal').oninput = function () { $('sealVal').textContent = this.value; };

  /* ---------- 识别 ---------- */
  function runDetect() {
    if (!state.img) return;
    var bar = $('bar');
    bar.classList.remove('hidden', 'warn');
    bar.textContent = '识别中…（大图要几秒）';
    setTimeout(function () {
      var t0 = Date.now(), res;
      try {
        res = window.FloorDetect.analyze(state.img, {
          threshold: parseInt($('thr').value, 10),
          sealPx: parseInt($('seal').value, 10)
        });
      } catch (err) {
        bar.classList.add('warn');
        bar.textContent = '识别失败：' + err.message;
        return;
      }
      state.res = res;
      draw();
      var st = res.stats;
      var msg = '识别到 ' + st.rooms + ' 个房间、' + st.nodes + ' 个路点、' + st.edges +
        ' 条连线（' + ((Date.now() - t0) / 1000).toFixed(1) + ' 秒）';
      if (st.islands) { msg += '　⚠ ' + st.islands + ' 个点没连上主路网'; bar.classList.add('warn'); }
      if (!st.rooms) { msg += '　没找到房间：把「房间封口」调大再试'; bar.classList.add('warn'); }
      bar.textContent = msg;
    }, 40);
  }
  $('run').onclick = runDetect;

  /* ---------- 画到图上（图片放在 SVG 里，保证严格对齐） ---------- */
  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  /* 按容器大小等比缩放：img 和 svg 用同一个像素尺寸，叠加严格对齐 */
  function fit() {
    if (!state.img) return;
    var stage = $('stage'), wrap = $('wrap'), pic = $('pic');
    var aw = Math.max(80, stage.clientWidth - 20);
    var ah = Math.max(80, stage.clientHeight - 20);
    var s = Math.min(aw / state.W, ah / state.H);
    var w = Math.max(40, Math.round(state.W * s));
    var hh = Math.max(40, Math.round(state.H * s));
    wrap.style.width = w + 'px';
    wrap.style.height = hh + 'px';
    pic.style.width = w + 'px';
    pic.style.height = hh + 'px';
  }

  window.addEventListener('resize', fit);

  function draw() {
    var svg = $('ov');
    var wrap = $('wrap');
    var pic = $('pic');
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    if (!state.img) return;

    if (!pic.src) pic.src = state.img.src;
    wrap.classList.add('on');
    fit();

    svg.setAttribute('viewBox', '0 0 ' + state.W + ' ' + state.H);
    svg.setAttribute('preserveAspectRatio', 'none');   // 和 img 同尺寸，不会变形

    var res = state.res;
    if (!res) return;

    // 连线
    var gE = el('g', {});
    res.edges.forEach(function (e) {
      var a = res.nodes[e[0]], b = res.nodes[e[1]];
      if (!a || !b) return;
      gE.appendChild(el('line', {
        x1: a.x, y1: a.y, x2: b.x, y2: b.y,
        stroke: '#38bdf8', 'stroke-width': Math.max(1.5, state.W / 700), 'stroke-opacity': .75
      }));
    });
    svg.appendChild(gE);

    // 房间框 + 编号
    var gR = el('g', {});
    var ordered = window.FloorImport.sortRooms(res.rooms);
    ordered.forEach(function (r, i) {
      gR.appendChild(el('rect', {
        x: r.x, y: r.y, width: r.w, height: r.h, rx: 4,
        fill: '#14b8a6', 'fill-opacity': .14, stroke: '#0d9488',
        'stroke-width': Math.max(2, state.W / 500)
      }));
      var t = el('text', {
        x: r.x + 8, y: r.y + 8 + state.W / 60,
        'font-size': Math.max(16, state.W / 45), fill: '#0f766e', 'font-weight': 800,
        'font-family': 'sans-serif'
      });
      t.textContent = (i + 1);
      gR.appendChild(t);
    });
    svg.appendChild(gR);

    // 路点
    var gN = el('g', {});
    var rr = Math.max(2.5, state.W / 420);
    res.nodes.forEach(function (n) {
      gN.appendChild(el('circle', { cx: n.x, cy: n.y, r: rr, fill: '#0284c7', 'fill-opacity': .9 }));
    });
    svg.appendChild(gN);
  }

  /* ---------- 生成数据 ---------- */
  $('gen').onclick = function () {
    var out = $('out');
    out.innerHTML = '';
    if (!state.res) {
      out.innerHTML = '<div class="bar warn">还没有识别结果，先选图并识别。</div>';
      return;
    }
    var opt = {
      floorId: $('fId').value.trim() || 'X-1',
      building: $('fBuilding').value.trim() || 'A',
      name: $('fName').value.trim() || '1层',
      image: $('fImage').value.trim(),
      width: state.W,
      height: state.H,
      roomNumbers: $('roomNumbers').value.trim()
    };
    var built = window.FloorImport.build(state.res, opt);

    // 把比例尺写进提示（floor 结构里没有 scale，全站共用一个 metersPerPixel）
    var scale = parseFloat($('fScale').value) || 0.045;

    var floorJson = JSON.stringify(built.floor, null, 2);
    var labsJson = JSON.stringify(built.labs, null, 2);

    var html = '';
    if (built.warnings.length) {
      html += '<div class="warns"><b>生成完了，这几处建议人工看一眼：</b><ul>';
      built.warnings.forEach(function (w) { html += '<li>' + esc(w) + '</li>'; });
      html += '</ul></div>';
    } else {
      html += '<div class="bar">没有发现明显问题：' + built.labs.length + ' 间房都挂上了门口的路点。</div>';
    }

    html += '<h2>① 粘到 data/labs.js 的 floors 数组里</h2>';
    html += '<textarea id="taFloor" rows="9" readonly>' + esc(floorJson) + '</textarea>';
    html += '<button class="btn block" id="cpFloor" style="margin-top:6px">复制 floors</button>';

    html += '<h2>② 粘到 data/labs.js 的 labs 数组里</h2>';
    html += '<textarea id="taLabs" rows="9" readonly>' + esc(labsJson) + '</textarea>';
    html += '<button class="btn block" id="cpLabs" style="margin-top:6px">复制 labs</button>';

    html += '<h2>③ 别忘了</h2>';
    html += '<div class="muted">';
    html += '· 把平面图图片复制到 <code>' + esc(opt.image || 'assets/floors/') + '</code><br>';
    if (Math.abs(scale - 0.045) > 0.0005) {
      html += '· 你填的比例尺是 <b>' + scale + '</b>，和全站默认的 0.045 不一样。<b>metersPerPixel 是全站共用的</b>，' +
        '改它会影响已有楼层，请确认再用。<br>';
    }
    html += '· 定位码（ArUco）要在 <code>locations</code> 里加，指到这一层的某个节点上<br>';
    html += '· 房间号是机器读不出来的，记得把占位的 R1、R2 改成真门牌';
    html += '</div>';

    out.innerHTML = html;
    $('cpFloor').onclick = function () { copy($('taFloor')); };
    $('cpLabs').onclick = function () { copy($('taLabs')); };
  };

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function copy(ta) {
    ta.select();
    try {
      navigator.clipboard.writeText(ta.value).then(function () { flash('已复制'); },
        function () { document.execCommand('copy'); flash('已复制'); });
    } catch (e) { document.execCommand('copy'); flash('已复制'); }
  }

  function flash(msg) {
    var d = document.createElement('div');
    d.textContent = msg;
    d.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);' +
      'background:#0f172a;color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:9';
    document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, 1400);
  }
})();
</script>
</body>
</html>
