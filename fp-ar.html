<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<title>第一人称地图探索 · AR 实时导航</title>
<style>
  :root{ --bg:#0f1419; --panel:#171d26; --line:#2a3340; --txt:#e6ebf2; --dim:#8b98a8; --acc:#38bdf8;
    --ar-accent:#2dd4bf; --ar-ink:#f8fafc; --ar-dim:rgba(226,232,240,.72); }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--txt);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif; overflow:hidden; }
  #app{ display:flex; flex-direction:column; height:100%; }
  header{ display:flex; align-items:center; gap:12px; padding:8px 14px;
    border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header h1{ font-size:14px; margin:0; font-weight:600; }
  .hud{ display:flex; gap:14px; flex-wrap:wrap; font:12px/1.5 ui-monospace,Menlo,Consolas,monospace; color:var(--dim); }
  .hud b{ color:var(--txt); font-weight:600; }
  .spacer{ flex:1; }
  button{ background:#1d2834; color:var(--txt); border:1px solid var(--line); border-radius:6px;
    padding:5px 10px; font-size:12px; cursor:pointer; }
  button:hover{ border-color:var(--acc); }
  button.on{ background:var(--acc); color:#04121f; border-color:var(--acc); }
  #destInput{ background:#0f1419; border:1px solid var(--line); border-radius:6px; color:var(--txt);
    padding:5px 10px; font-size:12px; width:190px; outline:none; }
  #destInput:focus{ border-color:var(--acc); }
  #destInput::placeholder{ color:var(--dim); }
  select{ background:#1d2834; color:var(--txt); border:1px solid var(--line); border-radius:6px;
    padding:5px 8px; font-size:12px; cursor:pointer; max-width:170px; }
  select:hover{ border-color:var(--acc); }
  main{ flex:1; display:flex; min-height:0; }

  /* 左侧 AR 区域：相机(或模拟)画面 + 叠加层 */
  #arWrap{ flex:3; position:relative; min-width:0; background:#050a14; overflow:hidden; }
  #arCam{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  #arSim{ position:absolute; inset:0; z-index:0; display:block; }
  #arVeil{ position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(180deg,rgba(3,7,18,.72) 0%,rgba(3,7,18,0) 24%),
      linear-gradient(0deg,rgba(3,7,18,.82) 0%,rgba(3,7,18,.1) 40%,rgba(3,7,18,0) 58%); }

  /* AR 叠加：大箭头 + 指引 */
  #arHud{ position:absolute; inset:0; z-index:2; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; text-align:center; }
  #arMode{ font-size:11px; letter-spacing:1px; color:var(--ar-dim); padding:3px 10px; border-radius:999px;
    border:1px solid rgba(148,163,184,.28); background:rgba(9,15,26,.45); }
  #arMode.live{ color:#99f6e4; border-color:rgba(45,212,191,.55); background:rgba(13,148,136,.22); }
  #arArrow{ width:118px; height:118px; filter:drop-shadow(0 6px 18px rgba(45,212,191,.55));
    transition:transform .12s linear; }
  #arArrow path{ fill:var(--ar-accent); stroke:#042f2e; stroke-width:3; stroke-linejoin:round; }
  #arAction{ font-size:40px; font-weight:800; letter-spacing:2px; color:var(--ar-ink);
    text-shadow:0 2px 16px rgba(0,0,0,.6); line-height:1.15; margin-top:4px; }
  #arHint{ font-size:13px; color:var(--ar-accent); min-height:18px; }
  #arDetail{ margin-top:4px; font-size:13.5px; color:var(--ar-dim); max-width:86%; line-height:1.55; }

  /* AR 里程条 */
  #arTrack{ pointer-events:auto; margin-top:12px; width:min(86%,330px); padding:9px 13px 8px;
    border-radius:14px; background:rgba(9,15,26,.66); border:1px solid rgba(148,163,184,.28); }
  #arTrack .top{ display:flex; justify-content:space-between; align-items:baseline;
    font-size:11.5px; color:var(--ar-dim); }
  #arTrack .top b{ font-size:16px; color:var(--ar-ink); font-weight:700; }
  #arTrack .top .left b{ color:var(--ar-accent); }
  #arTrack .line{ height:5px; border-radius:3px; margin:7px 0 6px; background:rgba(148,163,184,.22); overflow:hidden; }
  #arTrack .line i{ display:block; height:100%; width:0; border-radius:3px;
    background:linear-gradient(90deg,#2dd4bf,#5eead4); transition:width .25s ease-out; }
  #arTrack .bot{ display:flex; justify-content:space-between; align-items:center; font-size:10.5px; color:rgba(148,163,184,.8); }
  #arTrack .fix{ display:flex; gap:6px; }
  #arTrack .fix button{ font-family:inherit; font-size:11px; line-height:1; padding:5px 9px; border-radius:8px;
    border:1px solid rgba(148,163,184,.28); background:rgba(255,255,255,.07); color:var(--ar-dim); }
  #arLoc{ position:absolute; z-index:3; top:12px; left:12px; right:12px;
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:14px;
    background:rgba(9,15,26,.72); border:1px solid rgba(148,163,184,.28); }
  #arLoc .t{ flex:1; min-width:0; }
  #arLoc .main{ font-size:14px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #arLoc .sub{ font-size:11px; color:var(--ar-dim); }
  #arLoc button{ flex:0 0 auto; }

  /* 警告横幅：摄像头/罗盘不可用时明说原因 */
  #arWarn{ position:absolute; z-index:3; top:calc(64px + 8px); left:12px; right:12px;
    padding:8px 12px; border-radius:12px; font-size:12px; line-height:1.5; text-align:left;
    background:rgba(251,191,36,.14); border:1px solid rgba(251,191,36,.45); color:#fde68a; }

  /* 扫码框（点「扫 ArUco 码」后出现） */
  #scanbox{ position:absolute; z-index:4; left:50%; top:46%; transform:translate(-50%,-50%);
    width:min(60%,260px); aspect-ratio:1/1; border-radius:16px; pointer-events:none; }
  #scanbox .c{ position:absolute; width:34px; height:34px; border:3px solid var(--ar-accent); border-radius:6px; }
  #scanbox .c.tl{ top:0; left:0; border-right:0; border-bottom:0; }
  #scanbox .c.tr{ top:0; right:0; border-left:0; border-bottom:0; }
  #scanbox .c.bl{ bottom:0; left:0; border-right:0; border-top:0; }
  #scanbox .c.br{ bottom:0; right:0; border-left:0; border-top:0; }
  #scanbox span{ position:absolute; bottom:-28px; left:0; right:0; text-align:center;
    font-size:12px; color:var(--ar-dim); letter-spacing:1px; }
  #scanbox .scanline{ position:absolute; left:8%; right:8%; height:2px;
    background:linear-gradient(90deg,transparent,var(--ar-accent),transparent);
    box-shadow:0 0 12px rgba(45,212,191,.8); animation:arscan 2.2s ease-in-out infinite; }
  @keyframes arscan{ 0%,100%{ top:12%; opacity:.2; } 50%{ top:86%; opacity:1; } }

  /* 右侧俯视总览（不变） */
  #ovWrap{ flex:2; position:relative; min-width:0; border-left:1px solid var(--line); background:#0a0e13; }
  #ovWrap canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .ov-label{ position:absolute; top:8px; left:10px; font-size:11px; color:var(--dim); pointer-events:none; }

  footer{ display:flex; gap:12px; align-items:center; padding:8px 14px; border-top:1px solid var(--line);
    background:var(--panel); flex-wrap:wrap; }
  footer .keys{ color:var(--dim); font-size:12px; }
  footer kbd{ background:#1d2834; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px;
    padding:1px 6px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:var(--txt); }
  #report{ max-height:40vh; overflow:auto; }
  #report div{ padding:3px 0; font-size:12px; border-bottom:1px dashed var(--line); }
  #report .pass{ color:#4ade80; } #report .fail{ color:#f87171; } #report .warn{ color:#fbbf24; }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>第一人称探索 · AR 导航</h1>
    <select id="buildingSel" title="选择楼栋"></select>
    <select id="floorSel" title="切换楼层"></select>
    <div class="hud">
      <span>位置 <b id="hudPos">—</b></span>
      <span>朝向 <b id="hudTheta">—</b></span>
      <span>最近路点 <b id="hudNode">—</b></span>
    </div>
    <div class="spacer"></div>
    <select id="stairSel" title="快速定位到楼梯口（作为起点）">
      <option value="">楼梯口定位…</option>
    </select>
    <input id="destInput" type="text" list="destList" placeholder="搜房间/编号（跨楼层），回车导航" autocomplete="off">
    <datalist id="destList"></datalist>
    <button id="btnGo" type="button">导航</button>
    <button id="btnScan" type="button" class="hidden">扫 ArUco 码</button>
    <button id="btnRescan" type="button">重新定位</button>
    <button id="btnSelfTest" type="button">自检</button>
  </header>

  <main>
    <div id="arWrap">
      <canvas id="arSim"></canvas>
      <video id="arCam" playsinline muted autoplay></video>
      <div id="arVeil"></div>
      <div id="arLoc">
        <div class="t"><div class="main" id="arLocMain">还没定位</div><div class="sub" id="arLocSub">选个起点或扫定位码</div></div>
        <button id="btnCompass" type="button">开罗盘</button>
      </div>
      <div id="arWarn" class="hidden"></div>
      <div id="scanbox" class="hidden">
        <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
        <div class="scanline"></div>
        <span>对准墙上的 ArUco 定位码</span>
      </div>
      <div id="arHud">
        <div id="arMode">模拟 AR</div>
        <svg id="arArrow" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6 L84 52 H64 V92 H36 V52 H16 Z" /></svg>
        <div id="arAction">选择目的地</div>
        <div id="arHint"></div>
        <div id="arDetail"></div>
        <div id="arTrack">
          <div class="top"><span>已走 <b id="arWalked">0</b> 米</span><span class="left">还剩 <b id="arLeft">0</b> 米</span></div>
          <div class="line"><i id="arProg"></i></div>
          <div class="bot"><span id="arStep">—</span><span class="fix"><button type="button" id="fixMinus">−5 米</button><button type="button" id="fixPlus">+5 米</button></span></div>
        </div>
      </div>
    </div>
    <div id="ovWrap"><canvas id="ovCanvas"></canvas><div class="ov-label">俯视总览 · 固定视角 · 黄=已清理的墙</div></div>
  </main>

  <footer>
    <span class="keys">
      <kbd>↑</kbd><kbd>↓</kbd> 前进/后退　
      <kbd>←</kbd><kbd>→</kbd> 左右转身　
      <kbd>Shift</kbd>+<kbd>←</kbd><kbd>→</kbd> 平移
    </span>
    <span class="keys" id="spawnNote"></span>
    <div class="spacer"></div>
    <div id="report" class="hidden"></div>
  </footer>
</div>

<script src="js/vendor/three.min.js"></script>
<script src="js/vendor/js-aruco2-cv.js"></script>
<script src="js/vendor/js-aruco2.js"></script>
<script src="data/labs.js?v=10"></script>
<script src="data/B2-2F_grid.js?v=10"></script>
<script src="data/B2-3F_grid.js?v=9"></script>
<script src="data/B2-5F_grid.js?v=10"></script>
<script src="js/fp-core.js?v=9"></script>
<script src="js/fp-view.js?v=9"></script>
<script src="js/fp-input.js?v=9"></script>
<script src="js/fp-validate.js?v=9"></script>
<script src="js/router.js?v=9"></script>
<script src="js/ar-bridge.js?v=10"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  function txt(id, v) { var el = $(id); if (el) el.textContent = v; }

  function fail(msg) {
    document.body.innerHTML = '<div style="padding:20px;font:14px/1.6 monospace;color:#f87171">' + msg + '</div>';
    throw new Error(msg);
  }
  if (!window.LAB_DATA) fail('data/labs.js 未加载或格式错误');

  var D = window.LAB_DATA;
  var G = window.LabRouter.buildGraph(D);
  var LABS = D.labs || [];
  var LOCS = D.locations || [];
  var Nav = window.ARBridge.init(D);

  var GRIDS = {
    'B2-2': { grid: window.FLOOR_B2_2, walls: window.FLOOR_B2_2_WALLS || [], removed: window.FLOOR_B2_2_REMOVED || [] },
    'B2-3': { grid: window.FLOOR_B2_3, walls: window.FLOOR_B2_3_WALLS || [], removed: window.FLOOR_B2_3_REMOVED || [] },
    'B2-5': { grid: window.FLOOR_B2_5, walls: window.FLOOR_B2_5_WALLS || [], removed: window.FLOOR_B2_5_REMOVED || [] }
  };
  function gridOf(fid) { return GRIDS[fid] || null; }
  function floorName(fid) { var f = null; D.floors.forEach(function (x) { if (x.id === fid) f = x; }); return f ? f.name : fid; }

  /* 可重绑状态 */
  var floor = null, world = null, ov = null, player = null;
  var walkTrail = [];
  var labsById = {}; LABS.forEach(function (l) { labsById[l.id] = l; });
  var locsByMarker = {}; LOCS.forEach(function (l, i) { locsByMarker[(l.marker === undefined ? i : l.marker)] = l; });

  /* ---------- 楼层切换 ---------- */
  function switchFloor(fid, silent) {
    if (!gridOf(fid)) { txt('spawnNote', '该楼层无墙数据：' + fid); return false; }
    var f = null; D.floors.forEach(function (x) { if (x.id === fid) f = x; });
    floor = f;
    world = window.FPWorld.create({ grid: gridOf(fid).grid, rooms: f.rooms || [], nodes: f.nodes || [], edges: f.edges || [], walls: gridOf(fid).walls });
    ov = window.FPView.initOverview($('ovCanvas'), world, gridOf(fid).removed);

    var loc = null; (D.locations || []).forEach(function (l) { if (!loc && l.floor === fid) loc = l; });
    var params = new URLSearchParams(location.search);
    var spawnNode = (params.get('floor') === fid && params.get('node')) || (loc ? loc.node : null) || (f.nodes && f.nodes[0] && f.nodes[0].id);
    player = world.spawnAtNode(spawnNode, 90) || { x: world.width / 2, y: world.height / 2, theta: 0 };
    walkTrail = [{ x: player.x, y: player.y }];
    $('floorSel').value = fid;
    if (!silent) txt('spawnNote', '已切换到 ' + floorName(fid) + ' · 出生点 ' + spawnNode);
    onResize();
    return true;
  }

  /* ---------- 定位（AR 定位 / 楼梯口定位 / 手动） ---------- */
  function doLocate(loc) {
    if (!loc) return;
    if (loc.floor !== floor.id) switchFloor(loc.floor, true);
    Nav.setLoc(loc);
    var s = world.spawnAtNode(loc.node, ((loc.normal === undefined ? 90 : loc.normal) + 180) % 360);
    if (s) player = s;
    walkTrail = [{ x: player.x, y: player.y }];
    txt('arLocMain', loc.place);
    txt('arLocSub', '已定位 · 面向墙面');
  }

  /* ---------- 目标 + 导航 ---------- */
  function findLab(text) {
    var ql = String(text || '').trim().toLowerCase();
    if (!ql) return null;
    var hit = null;
    LABS.forEach(function (l) {
      if (hit) return;
      if (String(l.room).toLowerCase() === ql || String(l.id).toLowerCase() === ql || (l.name || '').toLowerCase().indexOf(ql) > -1) hit = l;
    });
    if (!hit) LABS.forEach(function (l) { if (hit) return; if (String(l.room).indexOf(ql) > -1) hit = l; });
    return hit;
  }

  function startNav(destText) {
    var hit = findLab(destText);
    if (!hit) { txt('spawnNote', '找不到目的地：' + destText); return false; }
    if (hit.floor !== floor.id) switchFloor(hit.floor, true);
    /* 还没定位：默认从该层第一个楼梯口出发 */
    if (!Nav.state.loc) {
      var loc = null; LOCS.forEach(function (l) { if (!loc && l.floor === floor.id) loc = l; });
      if (loc) doLocate(loc);
    }
    Nav.setTarget(hit);
    if (!Nav.state.route) { txt('spawnNote', '目的地未连通：' + hit.name); return false; }
    /* 把玩家放到路线起点 */
    var r0 = Nav.state.route.nodes[0];
    if (r0 && G.nodes[r0]) { player = { x: G.nodes[r0].x, y: G.nodes[r0].y, theta: Nav.state.facing }; }
    walkTrail = [{ x: player.x, y: player.y }];
    txt('spawnNote', 'AR 导航 → ' + hit.name + '（' + floorName(hit.floor) + ' ' + hit.room + '）· 全程 ' + Math.round(Nav.track.total) + ' 米');
    renderAr();
    return true;
  }

  /* ---------- 楼 → 楼层 → 楼梯口/搜索候选 联动 ---------- */
  var curBuilding = null;

  function buildingOf(floorId) {
    var f = null; D.floors.forEach(function (x) { if (x.id === floorId) f = x; });
    return f ? f.building : null;
  }
  function floorsOf(buildingId) {
    return D.floors.filter(function (f) { return f.building === buildingId; });
  }

  /* 楼下拉 */
  function fillBuildings() {
    var sel = $('buildingSel');
    sel.innerHTML = '';
    (D.buildings || []).forEach(function (b) {
      var o = document.createElement('option');
      o.value = b.id; o.textContent = '楼：' + b.name;
      sel.appendChild(o);
    });
    sel.onchange = function () {
      if (!this.value) return;
      curBuilding = this.value;
      fillFloors();
      fillStairs();
      fillDatalist();
      /* 切到该楼第一层 */
      var fs = floorsOf(curBuilding);
      if (fs.length) switchFloor(fs[0].id, true);
    };
  }

  /* 楼层下拉：只显示当前楼 */
  function fillFloors() {
    var sel = $('floorSel');
    sel.innerHTML = '';
    floorsOf(curBuilding).forEach(function (f) {
      if (!gridOf(f.id)) return;
      var o = document.createElement('option');
      o.value = f.id; o.textContent = '楼层：' + f.name;
      sel.appendChild(o);
    });
    sel.onchange = function () { if (this.value) switchFloor(this.value); };
  }

  /* 楼梯口定位：只显示当前楼的楼梯间 */
  function fillStairs() {
    var sel = $('stairSel');
    sel.innerHTML = '<option value="">楼梯口定位…</option>';
    LABS.forEach(function (l) {
      if (!l.tags || l.tags.indexOf('楼梯间') < 0 || !l.door) return;
      if (buildingOf(l.floor) !== curBuilding) return;
      var o = document.createElement('option'); o.value = l.door + '|' + l.floor; o.textContent = floorName(l.floor) + ' · ' + l.name; sel.appendChild(o);
    });
    sel.onchange = function () {
      if (!this.value) return;
      var parts = this.value.split('|');
      if (parts[1] !== floor.id) switchFloor(parts[1], true);
      var loc = null; LOCS.forEach(function (x) { if (x.node === parts[0]) loc = x; });
      if (loc) { doLocate(loc); } else {
        var n = null; floor.nodes.forEach(function (x) { if (x.id === parts[0]) n = x; });
        if (n) { doLocate({ id: 'tmp', floor: floor.id, node: n.id, place: floorName(floor.id) + ' · 楼梯口', normal: 90 }); }
      }
      txt('spawnNote', '已定位到楼梯口，输入目的地开始 AR 导航');
    };
  }

  /* 搜索候选：只显示当前楼的房间 */
  function fillDatalist() {
    var dl = $('destList');
    dl.innerHTML = '';
    LABS.forEach(function (l) {
      if (buildingOf(l.floor) !== curBuilding) return;
      var o = document.createElement('option'); o.value = String(l.room); o.label = l.name + '（' + floorName(l.floor) + '）'; dl.appendChild(o);
    });
  }

  $('destInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') startNav($('destInput').value); });
  $('btnGo').onclick = function () { startNav($('destInput').value); };

  /* ---------- 扫 ArUco 码（手动触发定位） ----------
     试点期墙面只贴二维码、没有 ArUco，置 false：
     隐藏按钮，并让「重新定位」不再自动进扫码态（否则会提示去对不存在的码）。
     将来恢复贴 ArUco 时把这里改回 true 即可，其余代码不用动。 */
  var ARUCO_ENABLED = false;
  if (!ARUCO_ENABLED) $('btnScan').classList.add('hidden');

  $('btnScan').onclick = function () {
    if (!ARUCO_ENABLED) return;
    if (scanning) { stopScan(); return; }
    startScan();
    txt('arLocSub', '请把墙上的 ArUco 定位码对准取景框');
  };

  /* ---------- 重新定位（重置当前定位，并回到扫码） ---------- */
  $('btnRescan').onclick = function () {
    stopScan();
    var params = new URLSearchParams(location.search);
    var locId = params.get('loc');
    if (locId) { LOCS.forEach(function (l) { if (l.id === locId) doLocate(l); }); return; }
    /* 手机：进入扫码重新定位（没有 ArUco 时退回按楼层默认点位） */
    if (ARUCO_ENABLED && video && video.videoWidth) { startScan(); txt('arLocSub', '重新扫码定位中…'); }
    else {
      var loc = null; LOCS.forEach(function (l) { if (!loc && l.floor === floor.id) loc = l; });
      if (loc) doLocate(loc);
    }
    txt('spawnNote', '重新定位，输入目的地开始导航');
  };

  /* ---------- 键盘移动（电脑模拟行走，驱动 AR 里程） ---------- */
  var action = {};
  window.FPInput.attach(window, action);

  /* ---------- 相机（手机扫码真机） ---------- */
  var video = $('arCam');
  var detector = null, work = null, workCtx = null, scanning = false;
  function warnCam(msg) { var w = $('arWarn'); if (w) { w.textContent = msg; w.classList.remove('hidden'); } $('arMode').textContent = '模拟画面 · 摄像头不可用'; }

  /* 确保检测器/离屏画布就绪 */
  function ensureDetector() {
    if (!detector) { try { detector = new AR.Detector({ dictionaryName: 'ARUCO' }); } catch (e) { return false; } }
    if (!work) { work = document.createElement('canvas'); workCtx = work.getContext('2d', { willReadFrequently: true }); }
    return true;
  }

  /* 启动扫码：显示扫码框 + 开始检测循环。可反复调用。 */
  function startScan() {
    if (!video || !video.videoWidth) {
      /* 摄像头还没就绪，先尝试开 */
      startCamera(true);
      return;
    }
    if (!ensureDetector()) { warnCam('定位码识别库没加载'); return; }
    scanning = true;
    var box = $('scanbox'); if (box) box.classList.remove('hidden');
    $('btnScan').classList.add('on');
    requestAnimationFrame(scanLoop);
  }
  function stopScan() {
    scanning = false;
    var box = $('scanbox'); if (box) box.classList.add('hidden');
    $('btnScan').classList.remove('on');
  }

  function startCamera(andScan) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
      return warnCam('这个浏览器不支持调用摄像头');
    if (!window.isSecureContext)
      return warnCam('当前是 http 链接，手机浏览器禁用了摄像头——请用 https 链接打开本页');
    navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } })
      .then(function (stream) { video.srcObject = stream; return video.play(); })
      .then(function () {
        var w = $('arWarn'); if (w) w.classList.add('hidden');
        $('arSim').classList.add('hidden');
        $('arCam').classList.remove('hidden');
        $('arMode').textContent = '实时摄像头 AR';
        ensureDetector();
        if (andScan) startScan();
      }).catch(function (e) {
        /* 不再静默：明说失败原因 */
        warnCam(e && e.name === 'NotAllowedError'
          ? '没拿到相机权限——请在浏览器设置里允许本页使用相机，然后刷新重试'
          : '相机打不开：' + (e && e.message || e));
      });
  }
  function scanLoop(ts) {
    if (!scanning) return;
    if (ts - (scanLoop.last || 0) > 220) {
      scanLoop.last = ts;
      if (video.videoWidth) {
        var sw = 340, sh = Math.round(sw * video.videoHeight / video.videoWidth);
        work.width = sw; work.height = sh;
        workCtx.drawImage(video, 0, 0, sw, sh);
        var img = workCtx.getImageData(0, 0, sw, sh);
        var found; try { found = detector.detectImage(sw, sh, img.data); } catch (e) { found = null; }
        if (found && found.length) {
          var loc = locsByMarker[found[0].id];
          if (loc) {
            stopScan();
            doLocate(loc);
            txt('arLocSub', '已通过 ArUco 定位码校准');
            if (navigator.vibrate) navigator.vibrate(60);
          } else {
            txt('arLocSub', '扫到码 ID ' + found[0].id + '，但数据里没有对应点位');
          }
        }
      }
    }
    requestAnimationFrame(scanLoop);
  }
  /* 进页面自动尝试开摄像头（仅开画面，不主动扫，等用户点「扫 ArUco 码」） */
  startCamera(false);

  /* ---------- 罗盘（手机） ---------- */
  var compassOn = false, baseCompass = null, compass = null, facingOffset = 0, orientBound = false;
  function onOrient(e) {
    var h = null;
    if (typeof e.webkitCompassHeading === 'number' && e.webkitCompassHeading >= 0) h = e.webkitCompassHeading;
    else if (e.absolute && e.alpha !== null) h = (360 - e.alpha) % 360;
    if (h === null) return;
    compass = compass === null ? h : compass + ((((h - compass + 540) % 360) - 180)) * 0.45;
    if (baseCompass === null && Nav.state.loc) baseCompass = compass;
    if (!compassOn) { compassOn = true; $('btnCompass').textContent = '罗盘已开'; }
  }
  $('btnCompass').onclick = function () {
    if (orientBound) return;
    if (typeof DeviceOrientationEvent === 'undefined') {
      this.textContent = '罗盘不可用'; $('arMode').textContent = '模拟画面 · 无罗盘传感器'; return;
    }
    if (!window.isSecureContext) {
      this.textContent = '罗盘不可用';
      $('arMode').textContent = '罗盘需要 https——请用 https 链接打开本页';
      return;
    }
    function bind() { if (!orientBound) { orientBound = true; window.addEventListener('deviceorientationabsolute', onOrient, true); window.addEventListener('deviceorientation', onOrient, true); } }
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(function (r) {
        if (r === 'granted') bind();
        else { $('btnCompass').textContent = '罗盘不可用'; $('arMode').textContent = '没给罗盘权限，朝向不会跟着转'; }
      }).catch(function () {
        $('btnCompass').textContent = '罗盘不可用';
        $('arMode').textContent = '罗盘授权失败（必须是用户点按钮触发，请再点一次）';
      });
    } else bind();
  };

  /* ---------- 模拟 AR 画布：第一人称俯视走廊（电脑验收用） ---------- */
  var simCv = $('arSim'), simCtx = simCv.getContext('2d');
  function renderSim() {
    var w = simCv.clientWidth, h = simCv.clientHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (simCv.width !== w * dpr) { simCv.width = w * dpr; simCv.height = h * dpr; }
    simCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    /* 背景：深色地面 */
    simCtx.fillStyle = '#1a2230'; simCtx.fillRect(0, 0, w, h);
    /* 简单的"第一人称走廊"透视：一个消失点 + 地砖线 + 两侧墙 */
    var vx = w / 2, vy = h * 0.42;
    simCtx.strokeStyle = 'rgba(148,163,184,.18)'; simCtx.lineWidth = 1;
    for (var i = 0; i <= 10; i++) { var yy = h * 0.42 + (h - h * 0.42) * (i / 10) * (i / 10); simCtx.beginPath(); simCtx.moveTo(0, yy); simCtx.lineTo(w, yy); simCtx.stroke(); }
    for (var j = -5; j <= 5; j++) { simCtx.beginPath(); simCtx.moveTo(vx + j * 60, h * 0.42); simCtx.lineTo(vx + j * 130, h); simCtx.stroke(); }
    /* 两侧墙 */
    simCtx.fillStyle = 'rgba(60,65,72,.85)'; simCtx.fillRect(0, 0, w * 0.22, h);
    simCtx.fillRect(w * 0.78, 0, w * 0.22, h);
    /* 朝向提示 */
    simCtx.fillStyle = 'rgba(139,152,168,.8)'; simCtx.font = '12px sans-serif'; simCtx.textAlign = 'center';
    simCtx.fillText('模拟 AR（电脑）· 手机扫码后为真实摄像头画面', w / 2, 16);
  }

  /* ---------- AR 画面渲染（箭头 + 指引 + 里程） ---------- */
  function renderAr() {
    var g = Nav.guidance();
    /* 等待状态：还没选目的地（只有定位）→ 不显示任何方向指引 */
    if (!g) {
      var wrap = $('arHud');
      var waiting = !Nav.state.lab;
      $('arArrow').classList.toggle('hidden', waiting);
      $('arTrack').classList.toggle('hidden', waiting);
      if (waiting) {
        txt('arAction', Nav.state.loc ? '已定位' : '还未定位');
        txt('arHint', '');
        txt('arDetail', Nav.state.loc
          ? '请在上方搜索框输入房间号或名称，开始导航'
          : '请扫墙上的 ArUco 定位码，或用楼梯口定位');
        txt('spawnNote', '等待状态：未选目的地，不显示方向指引');
      }
      return;
    }
    $('arArrow').classList.remove('hidden');
    $('arTrack').classList.remove('hidden');
    $('arArrow').style.transform = 'rotate(' + g.rel.toFixed(1) + 'deg)';
    txt('arAction', g.action);
    txt('arHint', g.hint);
    txt('arDetail', g.detail.join('，'));
    txt('arWalked', Math.round(g.pos));
    txt('arLeft', Math.round(g.left));
    var prog = $('arProg'); if (prog) prog.style.width = (g.total ? Math.min(100, g.pos / g.total * 100) : 0).toFixed(1) + '%';
    $('arMode').textContent = compassOn ? '实时跟随 · 跟着你转' : '模拟 AR';
    $('arMode').classList.toggle('live', !!compassOn);
  }

  /* ---------- 俯视 + HUD ---------- */
  function nearestNode(x, y) { var best = null, bd = Infinity; (world.nodes || []).forEach(function (n) { var d = Math.hypot(n.x - x, n.y - y); if (d < bd) { bd = d; best = n; } }); return best; }
  function updateHud() {
    txt('hudPos', Math.round(player.x) + ', ' + Math.round(player.y));
    txt('hudTheta', Math.round(player.theta) + '°');
    var n = nearestNode(player.x, player.y); txt('hudNode', n ? (n.id + (n.note ? ' · ' + n.note : '')) : '—');
  }

  /* ---------- 自检 ---------- */
  $('btnSelfTest').onclick = function () {
    var r = window.FPValidate.run(world);
    var box = $('report'); box.classList.remove('hidden'); box.innerHTML = '';
    r.forEach(function (it) { var d = document.createElement('div'); d.className = it.pass ? 'pass' : 'fail'; d.textContent = (it.pass ? '✓ ' : '✗ ') + it.name + ' —— ' + it.detail; box.appendChild(d); });
  };

  /* ---------- 主循环 ---------- */
  var last = performance.now();
  function loop(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    /* 键盘移动（电脑模拟行走）→ 驱动 AR 里程 */
    if (Nav.state.route && (action.fwd || action.back || action.strafeL || action.strafeR || action.turnL || action.turnR)) {
      player = world.step(player, action, dt);
      Nav.syncFromFp(player.x, player.y, player.theta);
    } else if (Nav.state.route) {
      /* AR 里程 → 世界坐标（手机计步推进时，实时同步玩家位置） */
      var sp = Nav.syncToFp();
      if (sp) { player.x = sp.x; player.y = sp.y; player.theta = sp.theta; }
    }

    /* 罗盘 → 朝向同步 */
    if (compassOn && baseCompass !== null && compass !== null && Nav.state.loc) {
      var baseFacing = ((Nav.state.loc.normal === undefined ? 90 : Nav.state.loc.normal) + 180) % 360;
      var dCompass = ((((compass - baseCompass) + 540) % 360) - 180);
      Nav.state.facing = (baseFacing + dCompass + facingOffset) % 360;
      player.theta = Nav.state.facing;
    }

    var lastT = walkTrail[walkTrail.length - 1];
    if (!lastT || Math.hypot(player.x - lastT.x, player.y - lastT.y) > 4) walkTrail.push({ x: player.x, y: player.y });

    renderSim();
    renderAr();
    window.FPView.renderOverview(ov, player, walkTrail);
    updateHud();
    requestAnimationFrame(loop);
  }

  function onResize() {
    var fw = $('arWrap').clientWidth, fh = $('arWrap').clientHeight;
    renderSim();
    ov.fit();
  }
  window.addEventListener('resize', onResize);

  /* ---------- 手动微调里程 ---------- */
  $('fixMinus').onclick = function () { Nav.advanceMeters(-5); if (Nav.state.arrived) Nav.state.arrived = false; };
  $('fixPlus').onclick = function () { Nav.advanceMeters(5); };

  /* ---------- 启动 ---------- */
  var params = new URLSearchParams(location.search);
  var startFloor = params.get('floor');

  /* 确定初始楼栋：优先按 floor 参数反推，否则第一栋楼 */
  if (startFloor && gridOf(startFloor)) {
    curBuilding = buildingOf(startFloor);
  } else {
    startFloor = D.floors[0].id;
    curBuilding = buildingOf(startFloor);
  }
  if (!curBuilding && D.buildings && D.buildings[0]) curBuilding = D.buildings[0].id;

  fillBuildings();
  $('buildingSel').value = curBuilding;
  fillFloors();
  fillStairs();
  fillDatalist();
  switchFloor(startFloor, true);

  /* ?loc= 直接定位（扫码链接跳转） */
  var locId = params.get('loc');
  if (locId) { var hitLoc = null; LOCS.forEach(function (l) { if (l.id === locId) hitLoc = l; }); if (hitLoc) doLocate(hitLoc); }

  txt('spawnNote', '当前 ' + floorName(floor.id) + ' · AR 导航已就绪，搜索框输入目的地');

  /* ?lab= / ?autowalk= 只预填目的地，不自动导航（默认永远进等待状态，由用户手动点「导航」） */
  var autoDest = params.get('lab') || params.get('autowalk');
  if (autoDest) {
    $('destInput').value = autoDest;
    txt('spawnNote', '已预填目的地 ' + autoDest + '（来自链接）· 点「导航」后才开始指引');
  }

  requestAnimationFrame(loop);

  /* ---------- 校验器对接（复用 fp 的 __FP__，扩展 AR 能力） ---------- */
  window.__FP__ = {
    version: world.version,
    get world() { return world; },
    getFloor: function () { return floor.id; },
    switchFloor: function (fid) { return switchFloor(fid, true); },
    getState: function () { var n = nearestNode(player.x, player.y); return { x: player.x, y: player.y, theta: player.theta, node: n ? n.id : null, floorId: floor.id }; },
    setState: function (x, y, theta) { player = { x: x, y: y, theta: world.normalizeAngle(theta || 0) }; return player; },
    teleportNode: function (nodeId, facingDeg) { var s = world.spawnAtNode(nodeId, facingDeg); if (s) player = s; return player; },
    step: function (act, dt) { player = world.step(player, act, dt); Nav.syncFromFp(player.x, player.y, player.theta); return window.__FP__.getState(); },
    castRay: function (theta) { return world.castRay(player.x, player.y, theta); },
    isWallPx: function (x, y) { return world.isWallPx(x, y); },
    grid: function () { return world.grid; }, rooms: function () { return world.rooms; }, nodes: function () { return world.nodes; }, edges: function () { return world.edges; }, walls: function () { return world.walls; },
    selfTest: function () { return window.FPValidate.run(world); },
    ar: function () { return Nav.guidance(); }
  };

  console.log('[FP-AR] AR 导航已启动，校验器 window.__FP__，AR 桥接 window.__AR__，当前层 ' + floor.id);
})();
</script>
</body>
</html>
